<title>軍師チェス</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Crimson+Pro:wght@600;700&display=swap">
<style>
/* 軍師チェス — 紙と墨と藍。盤は楓と胡桃。 */
:root {
  --bg: #E8EBE6;
  --panel: #F7F8F4;
  --panel-2: #EEF1EC;
  --ink: #1C2426;
  --muted: #5B6A6D;
  --line: #CBD3CE;
  --accent: #274C77;
  --accent-ink: #FFFFFF;
  --topbar: #1C2426;
  --topbar-ink: #E8EBE6;
  --topbar-muted: #A8B4B2;
  --light-sq: #E4D3B3;
  --dark-sq: #9E7451;
  --frame: #4A3A2A;
  --coord-light: #7A5A3C;
  --coord-dark: #E4D3B3;
  --sel: rgba(255, 200, 0, 0.55);
  --last: rgba(90, 150, 60, 0.42);
  --check: rgba(200, 50, 50, 0.75);
  --bar-bg: #1C2426;
  --bar-fill: #F7F8F4;
  --chip-bg: #E1E6E1;
  --chip-ink: #3E4C4F;
  --warn-bg: #F1D9D3;
  --warn-ink: #8A2E1E;
  --good: #2F7A4F;
  --bad: #A83A2A;
  --shadow: 0 8px 24px rgba(28, 36, 38, 0.18);
  --sq: min(11vw, 64px);
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --latin: "Crimson Pro", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161A1D; --panel: #1F2528; --panel-2: #262E31; --ink: #E4E7E2; --muted: #98A5A8; --line: #33403F;
    --accent: #7EA6D6; --accent-ink: #0F1215; --topbar: #0F1215; --topbar-ink: #E4E7E2; --topbar-muted: #7F8C8F;
    --light-sq: #BFA983; --dark-sq: #705238; --frame: #2A2018; --coord-light: #5C4028; --coord-dark: #BFA983;
    --bar-bg: #0B0E10; --bar-fill: #E4E7E2; --chip-bg: #2C3538; --chip-ink: #C5CFCB; --warn-bg: #4A2620; --warn-ink: #F0B4A6;
    --good: #6FBF8E; --bad: #E58A78; --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161A1D; --panel: #1F2528; --panel-2: #262E31; --ink: #E4E7E2; --muted: #98A5A8; --line: #33403F;
  --accent: #7EA6D6; --accent-ink: #0F1215; --topbar: #0F1215; --topbar-ink: #E4E7E2; --topbar-muted: #7F8C8F;
  --light-sq: #BFA983; --dark-sq: #705238; --frame: #2A2018; --coord-light: #5C4028; --coord-dark: #BFA983;
  --bar-bg: #0B0E10; --bar-fill: #E4E7E2; --chip-bg: #2C3538; --chip-ink: #C5CFCB; --warn-bg: #4A2620; --warn-ink: #F0B4A6;
  --good: #6FBF8E; --bad: #E58A78; --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  font-size: 15px;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
}
h1, h2 { margin: 0; font-family: var(--serif); font-weight: 700; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* 上部 */
.topbar {
  padding: 14px 24px 12px;
  background: var(--topbar);
  color: var(--topbar-ink);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 28px;
}
.topbar h1 { font-size: 1.7rem; letter-spacing: 0.12em; }
.tagline { margin: 0; font-size: 0.85rem; color: var(--topbar-muted); font-family: var(--serif); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-left: auto; font-size: 0.82rem; }
.controls label { display: flex; align-items: center; gap: 6px; color: var(--topbar-muted); }
select, button {
  font: inherit;
  padding: 5px 10px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
button:hover { background: var(--panel-2); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; letter-spacing: 0.05em; }
button.primary:hover { filter: brightness(1.12); }

main {
  display: grid;
  grid-template-columns: auto minmax(300px, 1fr) 230px;
  gap: 24px;
  padding: 22px 24px 40px;
  max-width: 1400px;
  margin: 0 auto;
}
@media (max-width: 1000px) {
  main { grid-template-columns: auto minmax(280px, 1fr); }
  .moves-panel { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  main { grid-template-columns: 1fr; padding: 16px; }
  .board-panel { justify-self: center; }
}

/* 紋 (軍師の印) */
.mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.1em; height: 2.1em; border-radius: 50%;
  font-family: var(--serif); font-weight: 700; font-size: 1.05rem; color: #FFFFFF;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
  flex-shrink: 0;
}
.mark.small { width: 1.7em; height: 1.7em; font-size: 0.8rem; margin-right: 6px; vertical-align: -0.35em; }

/* 盤 */
.board-panel { display: flex; flex-direction: column; gap: 10px; }
.board-wrap { position: relative; width: calc(var(--sq) * 8); }
.board {
  display: grid;
  grid-template-columns: repeat(8, var(--sq));
  grid-template-rows: repeat(8, var(--sq));
  border: 5px solid var(--frame);
  border-radius: 2px;
  box-shadow: var(--shadow);
  user-select: none;
}
.square {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--sq) * 0.78);
  line-height: 1;
  cursor: pointer;
}
.square.light { background: var(--light-sq); }
.square.dark { background: var(--dark-sq); }
.square.last { box-shadow: inset 0 0 0 100px var(--last); }
.square.selected { box-shadow: inset 0 0 0 100px var(--sel); }
.square.check { background: radial-gradient(circle, var(--check) 30%, transparent 75%); }
.square.target::after {
  content: "";
  position: absolute;
  width: 30%; height: 30%;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.28);
}
.square.target.capture::after {
  width: 90%; height: 90%;
  background: none;
  border: calc(var(--sq) * 0.09) solid rgba(0, 0, 0, 0.28);
}
.square .coord {
  position: absolute;
  font-family: var(--latin);
  font-size: calc(var(--sq) * 0.2);
  font-weight: 700;
  pointer-events: none;
}
.square .coord.file { right: 4px; bottom: 1px; }
.square .coord.rank { left: 4px; top: 1px; }
.square.light .coord { color: var(--coord-light); }
.square.dark .coord { color: var(--coord-dark); }
.piece {
  font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols2", "DejaVu Sans", "Apple Symbols", sans-serif;
  pointer-events: none;
  transform: translateY(-3%);
}
.piece.w { color: #FBFAF5; text-shadow: 0 0 1px #000, 0 0 2px #000, 0 1px 2px rgba(0,0,0,0.6); }
.piece.b { color: #1A1714; text-shadow: 0 0 1px #FFF, 0 1px 2px rgba(255,255,255,0.35); }
.arrows {
  position: absolute; inset: 5px;
  width: calc(100% - 10px); height: calc(100% - 10px);
  pointer-events: none;
}
.arrows .arrow { opacity: 0.4; transition: opacity 0.15s; }
.arrows .arrow.hot { opacity: 0.95; }

.opponent-line { min-height: 1.8em; font-size: 0.92rem; color: var(--muted); font-family: var(--serif); }
.opponent-line strong { color: var(--ink); }
.opponent-line .depth { margin-left: 8px; font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.05em; }
.eval-row { display: flex; align-items: center; gap: 10px; width: calc(var(--sq) * 8); }
.eval-bar { flex: 1; height: 10px; background: var(--bar-bg); border-radius: 2px; overflow: hidden; border: 1px solid var(--frame); }
.eval-fill { height: 100%; background: var(--bar-fill); width: 50%; transition: width 0.4s; }
.eval-text { font-family: var(--latin); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; font-size: 1rem; }
.status { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; min-height: 1.7em; }
.status.thinking { color: var(--muted); font-weight: 500; }
.status.over { color: var(--bad); }
.board-buttons { display: flex; gap: 8px; }

/* 進言 */
.advice-panel h2, .moves-panel h2 { font-size: 1.15rem; letter-spacing: 0.08em; margin-bottom: 4px; }
.hint { margin: 0 0 8px; font-size: 0.8rem; color: var(--muted); }
.advice-status { font-size: 0.82rem; color: var(--muted); min-height: 1.4em; margin-bottom: 10px; }
.advice-status .spinner {
  display: inline-block; width: 0.8em; height: 0.8em; margin-right: 6px;
  border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; vertical-align: -1px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px 16px 10px;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
  animation: cardin 0.25s ease-out;
}
@keyframes cardin { from { opacity: 0.4; transform: translateY(4px); } }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
.card.disabled { cursor: default; opacity: 0.7; }
.card.disabled:hover { transform: none; box-shadow: none; border-color: var(--line); }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-head .name { font-family: var(--serif); font-weight: 700; font-size: 1.1rem; }
.card-head .trait { font-size: 0.75rem; letter-spacing: 0.12em; font-weight: 700; }
.card-head .also { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
.card-move { display: flex; align-items: baseline; gap: 14px; margin-top: 6px; }
.card-move .san { font-family: var(--latin); font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
.card-move .score { font-family: var(--latin); font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-move .score.good { color: var(--good); }
.card-move .score.bad { color: var(--bad); }
.card-comment { margin: 6px 0 4px; font-family: var(--serif); font-size: 0.98rem; }
.card-note { font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 0.72rem; background: var(--chip-bg); color: var(--chip-ink); border-radius: 2px; padding: 1px 7px; letter-spacing: 0.04em; }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pv { font-family: var(--latin); font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

/* 棋譜 */
.movelist { margin: 0; padding-left: 2.4em; font-family: var(--latin); font-size: 1.05rem; max-height: 420px; overflow-y: auto; }
.movelist li { padding: 1px 0; }
.movelist li span { display: inline-block; min-width: 3.6em; }
.roster { margin-top: 16px; font-size: 0.85rem; }
.roster summary { cursor: pointer; font-family: var(--serif); font-weight: 700; }
.roster ul { padding-left: 0; list-style: none; margin: 8px 0 0; }
.roster li { margin-bottom: 10px; }
.roster .desc { color: var(--muted); font-size: 0.78rem; display: block; margin-top: 2px; }

/* 昇格 */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal[hidden] { display: none; }
.modal-box { background: var(--panel); padding: 16px 20px; border-radius: 4px; text-align: center; box-shadow: var(--shadow); }
.modal-box p { margin: 0 0 10px; font-family: var(--serif); }
.promo-choices { display: flex; gap: 8px; justify-content: center; }
.promo-choices button { font-size: 2.4rem; line-height: 1; padding: 6px 10px; background: var(--dark-sq); }

</style>
<header class="topbar">
  <h1>軍師チェス</h1>
  <p class="tagline">自分で指してもよし、六人の軍師の進言から選ぶだけでもよし。</p>
  <div class="controls">
    <label>あなたの色
      <select id="color-select">
        <option value="w">白（先手）</option>
        <option value="b">黒（後手）</option>
        <option value="r">ランダム</option>
      </select>
    </label>
    <label>相手の強さ
      <select id="level-select">
        <option value="0">入門</option>
        <option value="1">初級</option>
        <option value="2" selected>中級</option>
        <option value="3">上級</option>
        <option value="4">達人</option>
      </select>
    </label>
    <label>相手の性格
      <select id="opp-select"><option value="random">ランダム</option></select>
    </label>
    <label>軍師の読み
      <select id="advice-depth">
        <option value="2">浅い（速い）</option>
        <option value="3" selected>普通</option>
        <option value="4">深い（遅い）</option>
      </select>
    </label>
    <button id="new-game" class="primary">新しい対局</button>
  </div>
</header>

<main>
  <section class="board-panel">
    <div class="opponent-line" id="opponent-line"></div>
    <div class="board-wrap">
      <div id="board" class="board"></div>
      <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
    </div>
    <div class="eval-row">
      <div class="eval-bar" title="形勢（白から見た評価）"><div id="eval-fill" class="eval-fill"></div></div>
      <span id="eval-text" class="eval-text">+0.0</span>
    </div>
    <div id="status" class="status"></div>
    <div class="board-buttons">
      <button id="undo">待った</button>
      <button id="flip">盤を反転</button>
      <button id="resign">投了</button>
    </div>
  </section>

  <section class="advice-panel">
    <h2>軍師の進言</h2>
    <p class="hint">カードをクリックするとその手を指します。盤面を直接クリックして指すこともできます。</p>
    <div id="advice-status" class="advice-status"></div>
    <div id="cards" class="cards"></div>
  </section>

  <section class="moves-panel">
    <h2>棋譜</h2>
    <ol id="movelist" class="movelist"></ol>
    <details class="roster">
      <summary>軍師紹介</summary>
      <ul id="roster"></ul>
    </details>
  </section>
</main>

<div id="promo-dialog" class="modal" hidden>
  <div class="modal-box">
    <p>昇格する駒を選んでください</p>
    <div class="promo-choices"></div>
  </div>
</div>
<script>
/*
 * chess.js — チェスのルール実装 (0x88 盤表現)
 *
 * ブラウザでは window.Chess、Node では module.exports として公開する。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Chess = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const EMPTY = 0, PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  const WHITE = 1, BLACK = -1;
  const F_CAPTURE = 1, F_PAWN2 = 2, F_EP = 4, F_CASTLE = 8, F_PROMO = 16;
  const C_WK = 1, C_WQ = 2, C_BK = 4, C_BQ = 8;
  const PIECE_LETTERS = ' PNBRQK';
  const PIECE_FROM_CHAR = { p: 1, n: 2, b: 3, r: 4, q: 5, k: 6 };
  const KNIGHT_OFFS = [-33, -31, -18, -14, 14, 18, 31, 33];
  const BISHOP_OFFS = [-17, -15, 15, 17];
  const ROOK_OFFS = [-16, -1, 1, 16];
  const KING_OFFS = [-17, -16, -15, -1, 1, 15, 16, 17];
  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const VALUES = [0, 100, 320, 330, 500, 900, 20000];

  // 駒が動いたときに失われるキャスリング権のマスク
  const CASTLE_MASK = new Uint8Array(128).fill(15);
  CASTLE_MASK[0] &= ~C_WQ; CASTLE_MASK[4] &= ~(C_WK | C_WQ); CASTLE_MASK[7] &= ~C_WK;
  CASTLE_MASK[112] &= ~C_BQ; CASTLE_MASK[116] &= ~(C_BK | C_BQ); CASTLE_MASK[119] &= ~C_BK;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) | 0;
    };
  }

  // Zobrist ハッシュ (32bit を 2 本使う)
  const Z = (function () {
    const r1 = mulberry32(0x9E3779B9), r2 = mulberry32(0x7F4A7C15);
    const p1 = [], p2 = [];
    for (let p = 0; p < 14; p++) {
      p1.push(new Int32Array(128)); p2.push(new Int32Array(128));
      for (let s = 0; s < 128; s++) { p1[p][s] = r1(); p2[p][s] = r2(); }
    }
    const c1 = new Int32Array(16), c2 = new Int32Array(16);
    for (let i = 0; i < 16; i++) { c1[i] = r1(); c2[i] = r2(); }
    const e1 = new Int32Array(8), e2 = new Int32Array(8);
    for (let i = 0; i < 8; i++) { e1[i] = r1(); e2[i] = r2(); }
    return { p1, p2, c1, c2, e1, e2, s1: r1(), s2: r2() };
  })();

  const sqName = (s) => 'abcdefgh'[s & 7] + (1 + (s >> 4));
  const parseSq = (str) => ((str.charCodeAt(1) - 49) << 4) | (str.charCodeAt(0) - 97);
  const fileOf = (s) => s & 7;
  const rankOf = (s) => s >> 4;
  const onBoard = (s) => (s & 0x88) === 0;
  const encodeMove = (from, to, promo) => from | (to << 7) | (promo << 14);

  class Position {
    constructor(fen) {
      this.board = new Int8Array(128);
      this.side = WHITE;
      this.castling = 0;
      this.ep = -1;
      this.halfmove = 0;
      this.fullmove = 1;
      this.kingSq = [4, 116]; // [white, black]
      this.history = [];
      this.h1 = 0; this.h2 = 0;
      this.setFen(fen || START_FEN);
    }

    clone() {
      const p = Object.create(Position.prototype);
      p.board = new Int8Array(this.board);
      p.side = this.side; p.castling = this.castling; p.ep = this.ep;
      p.halfmove = this.halfmove; p.fullmove = this.fullmove;
      p.kingSq = this.kingSq.slice();
      p.history = this.history.slice();
      p.h1 = this.h1; p.h2 = this.h2;
      return p;
    }

    setFen(fen) {
      const parts = fen.trim().split(/\s+/);
      this.board.fill(0);
      let rank = 7, file = 0;
      for (const ch of parts[0]) {
        if (ch === '/') { rank--; file = 0; }
        else if (ch >= '1' && ch <= '8') file += +ch;
        else {
          const p = PIECE_FROM_CHAR[ch.toLowerCase()];
          const color = ch === ch.toUpperCase() ? WHITE : BLACK;
          this.board[(rank << 4) | file] = p * color;
          file++;
        }
      }
      this.side = parts[1] === 'b' ? BLACK : WHITE;
      this.castling = 0;
      if (parts[2] && parts[2] !== '-') {
        for (const c of parts[2]) {
          if (c === 'K') this.castling |= C_WK;
          else if (c === 'Q') this.castling |= C_WQ;
          else if (c === 'k') this.castling |= C_BK;
          else if (c === 'q') this.castling |= C_BQ;
        }
      }
      this.ep = parts[3] && parts[3] !== '-' ? parseSq(parts[3]) : -1;
      this.halfmove = parts[4] ? +parts[4] : 0;
      this.fullmove = parts[5] ? +parts[5] : 1;
      this.history = [];
      for (let s = 0; s < 128; s++) {
        if (s & 0x88) { s += 7; continue; }
        if (this.board[s] === KING) this.kingSq[0] = s;
        else if (this.board[s] === -KING) this.kingSq[1] = s;
      }
      this.computeHash();
    }

    fen() {
      let out = '';
      for (let r = 7; r >= 0; r--) {
        let empty = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.board[(r << 4) | f];
          if (p === 0) { empty++; continue; }
          if (empty) { out += empty; empty = 0; }
          const ch = PIECE_LETTERS[Math.abs(p)];

  'use strict';

  const { PAWN, KNIGHT, BISHOP, ROOK, QUEEN, KING, WHITE, VALUES, F_CAPTURE, F_CASTLE, F_PROMO, F_EP,
    KNIGHT_OFFS, BISHOP_OFFS, ROOK_OFFS, KING_OFFS, onBoard, fileOf, rankOf, sqName } = Chess;

  const PIECE_JA = ['', 'ポーン', 'ナイト', 'ビショップ', 'ルーク', 'クイーン', 'キング'];

  /** sq にある駒 (color 側) が攻撃しているマスの一覧 */
  function attacksFrom(pos, sq) {
    const b = pos.board, p = b[sq];
    const out = [];
    const pt = Math.abs(p), color = p > 0 ? 1 : -1;
    if (pt === PAWN) {
      const fwd = 16 * color;
      for (const d of [fwd - 1, fwd + 1]) if (onBoard(sq + d)) out.push(sq + d);
    } else if (pt === KNIGHT || pt === KING) {
      const offs = pt === KNIGHT ? KNIGHT_OFFS : KING_OFFS;
      for (const d of offs) if (onBoard(sq + d)) out.push(sq + d);
    } else {
      const offs = pt === BISHOP ? BISHOP_OFFS : pt === ROOK ? ROOK_OFFS : KING_OFFS;
      for (const d of offs) {
        for (let t = sq + d; onBoard(t); t += d) { out.push(t); if (b[t]) break; }
      }
    }
    return out;
  }

  /** 静的な「浮き駒」一覧: color 側の駒で、敵に攻撃され味方に守られていないもの */
  function hangingPieces(pos, color) {
    const out = [];
    const b = pos.board;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      const p = b[s];
      if (!p || (p > 0 ? 1 : -1) !== color || Math.abs(p) === KING) continue;
      if (pos.isAttacked(s, -color) && !pos.isAttacked(s, color)) out.push(s);
    }
    return out;
  }

  /** sq を攻撃している color 側の駒のうち最も安い駒の価値 (攻撃されていなければ Infinity) */
  function lowestAttackerValue(pos, sq, color) {
    const b = pos.board;
    let best = Infinity;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      const p = b[s];
      if (!p || (p > 0 ? 1 : -1) !== color) continue;
      const v = VALUES[Math.abs(p)];
      if (v >= best) continue;
      if (attacksFrom(pos, s).includes(sq)) best = v;
    }
    return best;
  }

  /**
   * 手の特徴を抽出する。pos は手を指す前の局面。
   */
  function moveFeatures(pos, m) {
    const us = pos.side, them = -us;
    const b = pos.board;
    const pt = Math.abs(m.piece);
    const f = { piece: pt, pieceName: PIECE_JA[pt], to: sqName(m.to), from: sqName(m.from), tags: [] };
    const capVal = m.captured ? VALUES[Math.abs(m.captured)] : 0;
    f.capture = !!(m.flags & F_CAPTURE);
    f.capturedName = m.captured ? PIECE_JA[Math.abs(m.captured)] : '';
    f.castle = !!(m.flags & F_CASTLE);
    f.promo = !!(m.flags & F_PROMO);
    f.enPassant = !!(m.flags & F_EP);
    f.kingMove = pt === KING && !f.castle;
    f.queenMove = pt === QUEEN;
    const homeRank = us === WHITE ? 0 : 7;
    f.develop = (pt === KNIGHT || pt === BISHOP) && rankOf(m.from) === homeRank && rankOf(m.to) !== homeRank;
    f.centerPawn = pt === PAWN && [51, 52, 67, 68].includes(m.to);
    const relTo = us === WHITE ? rankOf(m.to) : 7 - rankOf(m.to);
    f.pawnStorm = pt === PAWN && relTo >= 4 && !f.capture;
    const relFrom = us === WHITE ? rankOf(m.from) : 7 - rankOf(m.from);
    f.retreat = pt !== PAWN && pt !== KING && relTo < relFrom;
    f.rookOpenFile = false;
    if (pt === ROOK) {
      let open = true;
      for (let r = 0; r < 8; r++) if (Math.abs(b[(r << 4) | fileOf(m.to)]) === PAWN) { open = false; break; }
      f.rookOpenFile = open;
    }

    // 指す前: 自陣の浮き駒
    const hangBefore = hangingPieces(pos, us);
    const destAttackedBefore = pos.isAttacked(m.to, them);

    pos.make(m);
    f.check = pos.inCheck();
    const replies = pos.legalMoves();
    f.mate = f.check && replies.length === 0;
    f.stalemate = !f.check && replies.length === 0;
    f.replies = replies.length;
    // 動かした駒からの脅威
    const targets = attacksFrom(pos, m.to);
    const threatened = [];
    for (const t of targets) {
      const tp = b[t];
      if (!tp || (tp > 0 ? 1 : -1) !== them) continue;
      const tv = VALUES[Math.abs(tp)];
      if (Math.abs(tp) === KING) continue;
      const defended = pos.isAttacked(t, them);
      if (!defended || tv > VALUES[pt]) threatened.push({ sq: t, piece: Math.abs(tp), value: tv, defended });
    }
    threatened.sort((a, b2) => b2.value - a.value);
    f.threats = threatened;
    f.fork = threatened.length >= 2 || (threatened.length >= 1 && f.check);
    f.bigThreat = threatened.length >= 1 && threatened[0].value >= 300;
    // 指した後の自陣の浮き駒
    const hangAfter = hangingPieces(pos, us);
    f.defends = hangBefore.length > 0 && hangAfter.length < hangBefore.length;
    f.escapes = hangBefore.includes(m.from) && !hangAfter.includes(m.to);
    f.leavesHanging = hangAfter.includes(m.to);
    // 犠牲 (着地マスで取られると、取り返しても損する)
    const destDefended = pos.isAttacked(m.to, us);
    let loss = 0;
    if (destAttackedBefore && pt !== KING) {
      const attacker = lowestAttackerValue(pos, m.to, them);
      loss = (destDefended ? Math.max(0, VALUES[pt] - attacker) : VALUES[pt]) - capVal;
    }
    f.sacrifice = loss >= 200 && !f.mate;
    f.offersTrade = destAttackedBefore && destDefended && !f.capture && loss < 200 && loss > -200 && pt !== KING && pt !== PAWN;
    // 守り: 王周辺への敵の攻撃数の変化を簡易に
    const ks = pos.kingSq[us === WHITE ? 0 : 1];
    let enemyNearKing = 0;
    for (const d of KING_OFFS) if (onBoard(ks + d) && pos.isAttacked(ks + d, them)) enemyNearKing++;
    f.kingPressure = enemyNearKing;
    // 相手の王に迫る (着地マスが敵王に隣接 or 2 マス以内)
    const eks = pos.kingSq[them === WHITE ? 0 : 1];
    const dist = Math.max(Math.abs(fileOf(m.to) - fileOf(eks)), Math.abs(rankOf(m.to) - rankOf(eks)));
    f.nearEnemyKing = dist <= 2 && pt !== PAWN;
    pos.unmake();

    f.goodCapture = f.capture && (capVal >= VALUES[pt] || !destAttackedBefore);
    f.trade = f.capture && capVal === VALUES[pt] && destAttackedBefore;
    f.winsMaterial = f.capture && (capVal > VALUES[pt] || !destAttackedBefore) && capVal > 0;

    // タグ (UI 用チップ)
    if (f.mate) { f.tags.push('詰み'); return f; }
    if (f.check) f.tags.push('チェック');
    if (f.winsMaterial) f.tags.push('駒得');
    else if (f.trade) f.tags.push('交換');
    else if (f.capture) f.tags.push('駒取り');
    if (f.sacrifice) f.tags.push('犠牲');
    else if (f.offersTrade) f.tags.push('交換を打診');
    if (f.promo) f.tags.push('昇格');
    if (f.castle) f.tags.push('キャスリング');
    if (f.fork) f.tags.push('両取り');
    else if (f.bigThreat) f.tags.push('脅し');
    if (f.develop) f.tags.push('展開');
    if (f.centerPawn) f.tags.push('中央');
    if (f.rookOpenFile) f.tags.push('開いた筋');
    if (f.escapes) f.tags.push('退避');
    else if (f.defends) f.tags.push('守り');
    if (f.pawnStorm) f.tags.push('ポーン前進');
    if (f.nearEnemyKing && !f.check) f.tags.push('敵王に接近');
    if (f.leavesHanging) f.tags.push('取られる駒あり');
    return f;
  }

  /** 特徴から「主題」を 1 つ決める */
  function primaryFeature(f) {
    if (f.mate) return 'mate';
    if (f.check && f.fork) return 'fork';
    if (f.sacrifice) return 'sacrifice';
    if (f.winsMaterial) return 'win';
    if (f.check) return 'check';
    if (f.fork) return 'fork';
    if (f.promo) return 'promo';
    if (f.castle) return 'castle';
    if (f.trade) return 'trade';
    if (f.escapes) return 'escape';
    if (f.bigThreat) return 'threat';
    if (f.defends) return 'defend';
    if (f.develop) return 'develop';
    if (f.centerPawn) return 'center';
    if (f.rookOpenFile) return 'openfile';
    if (f.pawnStorm) return 'push';
    if (f.nearEnemyKing) return 'approach';
    if (f.kingMove) return 'king';
    if (f.retreat) return 'retreat';
    return 'quiet';
  }

  function fillTemplate(t, f, san) {
    return t.replace('{san}', san)
      .replace('{piece}', f.pieceName)
      .replace('{to}', f.to)
      .replace('{captured}', f.capturedName || '駒')
      .replace('{target}', f.threats && f.threats.length ? PIECE_JA[f.threats[0].piece] : '駒');
  }

  function comment(personality, f, san) {
    const key = primaryFeature(f);
    const table = LINES[personality.id] || {};
    const pool = table[key] || LINES.generic[key] || LINES.generic.quiet;
    const t = pool[Math.floor(Math.random() * pool.length)];
    return fillTemplate(t, f, san);
  }

  function formatScore(score) {
    if (Search.isMateScore(score)) {
      const n = Search.mateIn(score);
      return n > 0 ? `詰み ${n} 手` : `被詰み ${-n} 手`;
    }
    const p = score / 100;
    return (p > 0 ? '+' : '') + p.toFixed(1);
  }

  /**
   * 軍師の進言を作る。
   * opts: { depth, personalities, shouldAbort, onProgress }
   * 戻り値: { cards: [...], neutral: [...], bestScore }
   */
  async function advise(pos, opts) {
    opts = opts || {};
    const depth = opts.depth || 3;
    const personalities = opts.personalities || Eval.PERSONALITIES;
    const me = pos.side;
    const abort = opts.shouldAbort || (() => false);
    const progress = opts.onProgress || (() => {});
    const legal = pos.legalMoves();
    if (legal.length === 0) return { cards: [], neutral: [], bestScore: 0 };

    progress('参謀が全候補を採点中…');
    const balanced = Eval.personalityById('balanced');
    const neutral = await Search.rankMoves(pos, Eval.makeEvaluator(balanced.weights, me), depth, { shouldAbort: abort });
    if (!neutral) return null;
    const best = neutral[0].score;
    const neutralScore = new Map(neutral.map((r) => [r.move.enc, r]));

    const picks = [];
    const used = new Set();
    // 参謀 (総合最善) を先に確定させ、他の性格は重複時に別案を出せるようにする
    const ordered = personalities.slice().sort((a, b) => (a.id === 'balanced' ? -1 : b.id === 'balanced' ? 1 : 0));
    for (const p of ordered) {
      if (abort()) return null;
      let pick, alt = null;
      if (p.id === 'balanced' || legal.length === 1) {
        pick = neutral[0];
      } else {
        progress(`${p.name}(${p.trait})が検討中…`);
        let cands;
        if (Search.isMateScore(best) && best > 0) {
          cands = neutral.filter((r) => r.score === best);
        } else {
          cands = neutral.filter((r) => r.score >= best - p.margin && !(Search.isMateScore(r.score) && r.score < 0));
          if (cands.length < 3) cands = neutral.slice(0, 3);
        }
        cands = cands.slice(0, 12);
        if (cands.length === 1) pick = cands[0];
        else {
          const ranked = await Search.rankMoves(pos, Eval.makeEvaluator(p.weights, me), depth, {
            moves: cands.map((c) => c.move.enc), shouldAbort: abort,
          });
          if (!ranked) return null;
          pick = ranked[0];
          // 本命が他の軍師と同じなら、その性格にとって僅差の別案を出す
          if (used.has(pick.move.enc)) {
            const other = ranked.slice(1).find((r) => !used.has(r.move.enc) && pick.score - r.score <= p.margin * 0.6);
            if (other) { alt = pick; pick = other; }
          }
        }
      }
      used.add(pick.move.enc);
      picks.push({ personality: p, move: pick.move, pv: pick.pv, neutral: neutralScore.get(pick.move.enc), alt });
    }
    // 表示順は性格定義の順に戻す
    picks.sort((a, b) => personalities.indexOf(a.personality) - personalities.indexOf(b.personality));

    // 同じ手を推す性格はまとめる
    const cards = [];
    const byMove = new Map();
    for (const pk of picks) {
      let card = byMove.get(pk.move.enc);
      if (!card) {
        const f = moveFeatures(pos, pk.move);
        const san = pos.san(pk.move, legal);
        card = {
          move: pk.move, san, enc: pk.move.enc, features: f, tags: f.tags,
          personalities: [], score: pk.neutral.score, scoreText: formatScore(pk.neutral.score),
          pv: pk.pv, pvText: pvToSan(pos, pk.pv), comment: '', rank: neutral.findIndex((r) => r.move.enc === pk.move.enc) + 1,
          altOf: pk.alt ? pos.san(pk.alt.move, legal) : null,
        };
        byMove.set(pk.move.enc, card);
        cards.push(card);
      }
      card.personalities.push(pk.personality);
    }
    for (const c of cards) {
      c.comment = comment(c.personalities[0], c.features, c.san);
      if (c.altOf) c.note = `${c.altOf} も良いが、別案として。`;
    }
    return { cards, neutral, bestScore: best, side: me };
  }

  function pvToSan(pos, pv) {
    const p = pos.clone();
    const out = [];
    for (const m of pv) {
      const legal = p.legalMoves();
      const real = legal.find((x) => x.enc === m.enc);
      if (!real) break;
      out.push(p.san(real, legal));
      p.make(real);
    }
    return out.join(' ');
  }

  return { advise, moveFeatures, primaryFeature, comment, formatScore, pvToSan };
});

/* ui.js — 盤面・進言カード・対局進行 */
(function () {
  'use strict';
  const { Position, WHITE, BLACK, PAWN, KING, F_CAPTURE, F_PROMO, sqName, fileOf, rankOf } = Chess;
  const GLYPH = ['', '♟', '♞', '♝', '♜', '♛', '♚'];
  const PIECE_JA = ['', 'ポーン', 'ナイト', 'ビショップ', 'ルーク', 'クイーン', 'キング'];
  const LEVELS = [
    { name: '入門', depth: 2, timeMs: 400, random: 60 },
    { name: '初級', depth: 3, timeMs: 800, random: 25 },
    { name: '中級', depth: 4, timeMs: 1500, random: 8 },
    { name: '上級', depth: 6, timeMs: 3000, random: 0 },
    { name: '達人', depth: 9, timeMs: 7000, random: 0 },
  ];

  const $ = (id) => document.getElementById(id);
  const el = {
    board: $('board'), arrows: $('arrows'), status: $('status'), cards: $('cards'),
    adviceStatus: $('advice-status'), movelist: $('movelist'), evalFill: $('eval-fill'), evalText: $('eval-text'),
    opponentLine: $('opponent-line'), undo: $('undo'), flip: $('flip'), resign: $('resign'), newGame: $('new-game'),
    colorSelect: $('color-select'), levelSelect: $('level-select'), oppSelect: $('opp-select'),
    adviceDepth: $('advice-depth'), promo: $('promo-dialog'), roster: $('roster'),
  };

  const state = {
    pos: new Position(), playerColor: WHITE, flipped: false, sans: [],
    busy: false, over: false, token: 0, selected: null, legal: [], lastMove: null,
    advice: null, oppPersonality: null, level: LEVELS[2], adviceDepth: 3, hotEnc: null,
  };

  // ---------- 設定 ----------
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('gunshi-chess-settings') || '{}');
      if (s.color) el.colorSelect.value = s.color;
      if (s.level) el.levelSelect.value = s.level;
      if (s.opp) el.oppSelect.value = s.opp;
      if (s.adviceDepth) el.adviceDepth.value = s.adviceDepth;
    } catch (e) { /* ignore */ }
  }
  function saveSettings() {
    try {
      localStorage.setItem('gunshi-chess-settings', JSON.stringify({
        color: el.colorSelect.value, level: el.levelSelect.value, opp: el.oppSelect.value, adviceDepth: el.adviceDepth.value,
      }));
    } catch (e) { /* ignore */ }
  }

  // ---------- 盤描画 ----------
  function buildBoard() {
    el.board.innerHTML = '';
    for (let i = 0; i < 64; i++) {
      const d = document.createElement('div');
      d.className = 'square';
      d.addEventListener('click', () => onSquareClick(+d.dataset.sq));
      el.board.appendChild(d);
    }
  }

  function displayToSq(i) {
    let r = 7 - Math.floor(i / 8), f = i % 8;
    if (state.flipped) { r = 7 - r; f = 7 - f; }
    return (r << 4) | f;
  }

  function render() {
    const pos = state.pos;
    const check = !state.over && pos.inCheck();
    const kingSq = pos.kingSq[pos.side === WHITE ? 0 : 1];
    const targets = new Map(state.legal.map((m) => [m.to, m]));
    const squares = el.board.children;
    for (let i = 0; i < 64; i++) {
      const sq = displayToSq(i);
      const d = squares[i];
      d.dataset.sq = sq;
      const light = (fileOf(sq) + rankOf(sq)) % 2 === 1;
      let cls = 'square ' + (light ? 'light' : 'dark');
      if (state.lastMove && (sq === state.lastMove.from || sq === state.lastMove.to)) cls += ' last';
      if (state.selected === sq) cls += ' selected';
      if (targets.has(sq)) cls += ' target' + (targets.get(sq).flags & F_CAPTURE ? ' capture' : '');
      if (check && sq === kingSq) cls += ' check';
      d.className = cls;
      const p = pos.board[sq];
      let html = '';
      if (p) html += `<span class="piece ${p > 0 ? 'w' : 'b'}">${GLYPH[Math.abs(p)]}</span>`;
      const bottomRow = i >= 56, leftCol = i % 8 === 0;
      if (bottomRow) html += `<span class="coord file">${'abcdefgh'[fileOf(sq)]}</span>`;
      if (leftCol) html += `<span class="coord rank">${rankOf(sq) + 1}</span>`;
      d.innerHTML = html;
    }
    renderArrows();
    renderMoveList();
    el.undo.disabled = state.busy || state.pos.history.length === 0;
    el.resign.disabled = state.over || state.busy;
  }

  function sqCenter(sq) {
    let x = fileOf(sq), y = 7 - rankOf(sq);
    if (state.flipped) { x = 7 - x; y = 7 - y; }
    return [x + 0.5, y + 0.5];
  }

  function renderArrows() {
    const svg = el.arrows;
    svg.innerHTML = '';
    if (!state.advice || state.over) return;
    for (const card of state.advice.cards) {
      const [x1, y1] = sqCenter(card.move.from);
      const [x2, y2] = sqCenter(card.move.to);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const head = 0.38, w = 0.14;
      const bx = x2 - ux * head, by = y2 - uy * head;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'arrow' + (state.hotEnc === card.enc ? ' hot' : ''));
      const color = card.personalities[0].color;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', bx); line.setAttribute('y2', by);
      line.setAttribute('stroke', color); line.setAttribute('stroke-width', w); line.setAttribute('stroke-linecap', 'round');
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const px = -uy, py = ux;
      poly.setAttribute('points', `${x2},${y2} ${bx + px * 0.22},${by + py * 0.22} ${bx - px * 0.22},${by - py * 0.22}`);
      poly.setAttribute('fill', color);
      g.appendChild(line); g.appendChild(poly);
      svg.appendChild(g);
    }
  }

  function renderMoveList() {
    el.movelist.innerHTML = '';
    for (let i = 0; i < state.sans.length; i += 2) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${state.sans[i]}</span><span>${state.sans[i + 1] || ''}</span>`;
      el.movelist.appendChild(li);
    }
    el.movelist.scrollTop = el.movelist.scrollHeight;
  }

  function setStatus(text, cls) {
    el.status.textContent = text;
    el.status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function setEval(scoreForSide, side) {
    const white = side === WHITE ? scoreForSide : -scoreForSide;
    let pct;
    if (Search.isMateScore(white)) pct = white > 0 ? 100 : 0;
    else pct = 100 / (1 + Math.exp(-white / 350));
    el.evalFill.style.width = pct + '%';
    el.evalText.textContent = Search.isMateScore(white)
      ? (white > 0 ? '白詰み' : '黒詰み')
      : (white >= 0 ? '+' : '') + (white / 100).toFixed(1);
  }

  // ---------- 進言カード ----------
  function renderCards() {
    el.cards.innerHTML = '';
    if (!state.advice) return;
    for (const card of state.advice.cards) {
      const lead = card.personalities[0];
      const others = card.personalities.slice(1);
      const div = document.createElement('div');
      div.className = 'card' + (state.over || state.busy ? ' disabled' : '');
      const scoreCls = Search.isMateScore(card.score) ? (card.score > 0 ? 'good' : 'bad') : card.score > 50 ? 'good' : card.score < -50 ? 'bad' : '';
      div.innerHTML = `
        <div class="card-head">
          <span class="mark" style="background:${lead.color}">${lead.mark}</span>
          <span class="name">${lead.name}</span>
          <span class="trait" style="color:${lead.color}">${lead.trait}</span>
          ${others.length ? `<span class="also">${others.map((p) => p.name).join('・')} も賛成</span>` : ''}
        </div>
        <div class="card-move"><span class="san">${card.san}</span><span class="score ${scoreCls}">形勢 ${card.scoreText}</span></div>
        <div class="card-comment">「${card.comment}」</div>
        ${card.note ? `<div class="card-note">※ ${card.note}</div>` : ''}
        <div class="chips">${card.tags.map((t) => `<span class="chip${t === '取られる駒あり' ? ' warn' : ''}">${t}</span>`).join('')}</div>
        <div class="pv">読み筋: ${card.pvText}</div>`;
      div.addEventListener('mouseenter', () => { state.hotEnc = card.enc; renderArrows(); });
      div.addEventListener('mouseleave', () => { state.hotEnc = null; renderArrows(); });
      div.addEventListener('click', () => { if (!state.busy && !state.over) playerMove(card.move); });
      el.cards.appendChild(div);
    }
  }

  function setAdviceStatus(text, spinning) {
    el.adviceStatus.innerHTML = (spinning ? '<span class="spinner"></span>' : '') + text;
  }

  async function startAdvice() {
    const token = ++state.token;
    state.advice = null;
    renderCards(); renderArrows();
    if (state.over || state.pos.side !== state.playerColor) { setAdviceStatus(''); return; }
    setAdviceStatus('軍師たちが検討中…', true);
    const t0 = performance.now();
    const res = await Advisor.advise(state.pos, {
      depth: state.adviceDepth,
      shouldAbort: () => token !== state.token,
      onProgress: (msg) => { if (token === state.token) setAdviceStatus(msg, true); },
    });
    if (token !== state.token || !res) return;
    state.advice = res;
    setEval(res.bestScore, res.side);
    setAdviceStatus(`検討完了（${((performance.now() - t0) / 1000).toFixed(1)}秒）。${res.cards.length} 案あります。`);
    renderCards(); renderArrows();
  }

  // ---------- 対局進行 ----------
  function applyMove(m) {
    const legal = state.pos.legalMoves();
    const san = state.pos.san(m, legal);
    state.pos.make(m);
    state.sans.push(san);
    state.lastMove = m;
    state.selected = null; state.legal = [];
    return san;
  }

  function checkGameOver() {
    const st = state.pos.status();
    if (!st.over) return false;
    state.over = true;
    state.token++;
    state.advice = null;
    let msg;
    const playerWon = (st.result === '1-0' && state.playerColor === WHITE) || (st.result === '0-1' && state.playerColor === BLACK);
    if (st.reason === 'checkmate') msg = playerWon ? 'チェックメイト！ あなたの勝ちです。' : 'チェックメイト……あなたの負けです。';
    else if (st.reason === 'stalemate') msg = 'ステイルメイト。引き分けです。';
    else if (st.reason === 'repetition') msg = '同一局面 3 回。引き分けです。';
    else if (st.reason === 'fifty') msg = '50 手ルール。引き分けです。';
    else msg = '駒不足で詰ませられません。引き分けです。';
    setStatus(msg + ' [' + st.result + ']', 'over');
    setAdviceStatus('対局終了。「新しい対局」でもう一局どうぞ。');
    renderCards();
    return true;
  }

  function playerStatus() {
    const check = state.pos.inCheck();
    setStatus((check ? 'チェック！ ' : '') + `あなたの番です（${state.playerColor === WHITE ? '白' : '黒'}）`);
  }

  async function playerMove(m) {
    if (state.busy || state.over) return;
    state.token++;
    applyMove(m);
    state.advice = null;
    renderCards(); render();
    if (checkGameOver()) return;
    await opponentMove();
  }

  async function opponentMove() {
    state.busy = true;
    render(); renderCards();
    const p = state.oppPersonality;
    setStatus(`${p.name}（相手）が考え中…`, 'thinking');
    setAdviceStatus('');
    const oppColor = -state.playerColor;
    const weights = Object.assign({}, p.weights, { random: (p.weights.random || 0) + state.level.random });
    const evalFn = Eval.makeEvaluator(weights, oppColor);
    const before = state.pos.clone();
    const res = await Search.think(state.pos, evalFn, { maxDepth: state.level.depth, timeMs: state.level.timeMs });
    state.busy = false;
    if (!res || state.over) return;
    const legal = before.legalMoves();
    const f = Advisor.moveFeatures(before, res.move);
    const san = before.san(res.move, legal);
    const line = Advisor.comment(p, f, san);
    applyMove(res.move);
    el.opponentLine.innerHTML = `<span class="mark small" style="background:${p.color}">${p.mark}</span><strong>${p.name}</strong>（相手）「${line}」<span class="depth">深さ ${res.depth}</span>`;
    render();
    if (checkGameOver()) return;
    playerStatus();
    startAdvice();
  }

  function onSquareClick(sq) {
    if (state.busy || state.over || state.pos.side !== state.playerColor) return;
    const p = state.pos.board[sq];
    const own = p && (p > 0 ? WHITE : BLACK) === state.playerColor;
    if (state.selected !== null) {
      const cands = state.legal.filter((m) => m.to === sq);
      if (cands.length) {
        if (cands[0].flags & F_PROMO) {
          choosePromotion(state.playerColor).then((pt) => {
            const m = cands.find((c) => c.promo === pt);
            if (m) playerMove(m);
          });
          return;
        }
        playerMove(cands[0]);
        return;
      }
    }
    if (own && state.selected !== sq) {
      state.selected = sq;
      state.legal = state.pos.legalMoves().filter((m) => m.from === sq);
    } else {
      state.selected = null; state.legal = [];
    }
    render();
  }

  function choosePromotion(color) {
    return new Promise((resolve) => {
      const box = el.promo.querySelector('.promo-choices');
      box.innerHTML = '';
      for (const pt of [5, 2, 4, 3]) {
        const b = document.createElement('button');
        b.innerHTML = `<span class="piece ${color === WHITE ? 'w' : 'b'}">${GLYPH[pt]}</span>`;
        b.title = PIECE_JA[pt];
        b.addEventListener('click', () => { el.promo.hidden = true; resolve(pt); });
        box.appendChild(b);
      }
      el.promo.hidden = false;
    });
  }

  function undo() {
    if (state.busy || state.pos.history.length === 0) return;
    state.token++;
    const wasOver = state.over;
    state.over = false;
    state.pos.unmake(); state.sans.pop();
    if (state.pos.side !== state.playerColor && state.pos.history.length) { state.pos.unmake(); state.sans.pop(); }
    state.lastMove = state.pos.history.length ? state.pos.history[state.pos.history.length - 1].m : null;
    state.selected = null; state.legal = [];
    el.opponentLine.textContent = wasOver ? '' : el.opponentLine.textContent;
    render();
    if (state.pos.side === state.playerColor) { playerStatus(); startAdvice(); }
    else opponentMove();
  }

  function resign() {
    if (state.over || state.busy) return;
    state.over = true; state.token++; state.advice = null;
    setStatus('投了しました。相手の勝ちです。', 'over');
    setAdviceStatus('対局終了。「新しい対局」でもう一局どうぞ。');
    renderCards(); render();
  }

  function newGame() {
    saveSettings();
    state.token++;
    state.pos = new Position();
    state.sans = []; state.lastMove = null; state.selected = null; state.legal = [];
    state.over = false; state.busy = false; state.advice = null;
    const c = el.colorSelect.value;
    state.playerColor = c === 'w' ? WHITE : c === 'b' ? BLACK : (Math.random() < 0.5 ? WHITE : BLACK);
    state.flipped = state.playerColor === BLACK;
    state.level = LEVELS[+el.levelSelect.value] || LEVELS[2];
    state.adviceDepth = +el.adviceDepth.value || 3;
    const oppId = el.oppSelect.value;
    state.oppPersonality = oppId === 'random'
      ? Eval.PERSONALITIES[Math.floor(Math.random() * Eval.PERSONALITIES.length)]
      : Eval.personalityById(oppId);
    el.opponentLine.innerHTML = `<span class="mark small" style="background:${state.oppPersonality.color}">${state.oppPersonality.mark}</span>相手は <strong>${state.oppPersonality.name}</strong>（${state.oppPersonality.trait}・${state.level.name}）`;
    setEval(0, WHITE);
    render(); renderCards();
    if (state.pos.side === state.playerColor) { playerStatus(); startAdvice(); }
    else opponentMove();
  }

  // ---------- 初期化 ----------
  function init() {
    for (const p of Eval.PERSONALITIES) {
      const o = document.createElement('option');
      o.value = p.id; o.textContent = `${p.name}（${p.trait}）`;
      el.oppSelect.appendChild(o);
      const li = document.createElement('li');
      li.innerHTML = `<span class="mark small" style="background:${p.color}">${p.mark}</span><strong>${p.name}</strong>（${p.trait}）<span class="desc">${p.desc}</span>`;
      el.roster.appendChild(li);
    }
    loadSettings();
    buildBoard();
    el.newGame.addEventListener('click', newGame);
    el.undo.addEventListener('click', undo);
    el.resign.addEventListener('click', resign);
    el.flip.addEventListener('click', () => { state.flipped = !state.flipped; render(); });
    el.adviceDepth.addEventListener('change', () => { state.adviceDepth = +el.adviceDepth.value; saveSettings(); if (!state.busy && !state.over) startAdvice(); });
    el.levelSelect.addEventListener('change', () => { state.level = LEVELS[+el.levelSelect.value]; saveSettings(); });
    el.oppSelect.addEventListener('change', saveSettings);
    el.colorSelect.addEventListener('change', saveSettings);
    newGame();
  }

  // テスト用に公開
  window.GunshiChess = { state, playerMove, newGame, undo, LEVELS };
  init();
})();

</script>
